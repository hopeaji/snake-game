<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat
        // to guide your work through each step.
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================
        // ===== GAME STATE =====
        let gameRunning = true;
        let gameInterval = null;

        // ===== 1. MOVE THE SNAKE =====
        function moveSnake() {
            if (!gameRunning) return;

            // Create new head
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check wall collision
            if (
                head.x < 0 || head.x >= tileCount ||
                head.y < 0 || head.y >= tileCount
            ) {
                endGame();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                endGame();
                return;
                }
            }

            // Add new head
            snake.unshift(head);

            // Check if food was eaten
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("info").textContent = "Score: " + score;
                placeFood();          // grow by NOT removing the tail
            } else {
                snake.pop();          // normal move – remove tail
            }

                drawGame();
            }

            // ===== 2. PLACE FOOD IN A FREE SPOT =====
            function placeFood() {
                let newFood;
                do {
                    newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                    };
                } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));

                food = newFood;
            }

            // ===== 3. KEYBOARD CONTROLS =====
            document.addEventListener("keydown", function(e) {
                if (!gameRunning) return;
                if (e.key.startsWith("Arrow")) e.preventDefault();
                // Prevent reversing into yourself
                if (e.key === "ArrowUp"    && direction.y === 0) direction = { x: 0, y: -1 };
                if (e.key === "ArrowDown"  && direction.y === 0) direction = { x: 0, y:  1 };
                if (e.key === "ArrowLeft"  && direction.x === 0) direction = { x: -1, y: 0 };
                if (e.key === "ArrowRight" && direction.x === 0) direction = { x:  1, y: 0 };
            });

            // ===== 4. GAME OVER =====
            function endGame() {
                gameRunning = false;
                clearInterval(gameInterval);
                document.getElementById("info").textContent =
                    "Game Over! Score: " + score + " — Press R to restart";
            }

            // ===== 5. RESTART =====
            document.addEventListener("keydown", function(e) {
                if (e.key === "r" || e.key === "R") {
                    // Reset everything
                    snake = [
                    { x: 10, y: 10 },
                    { x: 9,  y: 10 },
                    { x: 8,  y: 10 }
                    ];
                    direction = { x: 1, y: 0 };
                    score = 0;
                    gameRunning = true;
                    placeFood();
                    document.getElementById("info").textContent = "Score: 0";
                    drawGame();

                    clearInterval(gameInterval);
                    gameInterval = setInterval(moveSnake, 150);
                }
            });
    </script>

</body>
</html>
